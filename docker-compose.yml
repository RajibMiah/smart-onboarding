services:
  mysql:
    image: mysql:8.4
    container_name: smart-onboarding-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # CMD-SHELL (not exec-form CMD) so $MYSQL_ROOT_PASSWORD actually expands
      # — keeps the password out of the compose file and out of `docker inspect`.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smart-onboarding

  backend:
    build:
      context: ./backend
    container_name: smart-onboarding-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Without this, every rebuild (a plain image rebuild, not just a fresh
      # `down`) wipes every uploaded avatar/clip/thumbnail — the container's
      # own filesystem is ephemeral and MEDIA_ROOT has never been backed by
      # anything durable.
      - media_files:/app/mediafiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/auth/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - smart-onboarding

  redis:
    image: redis:7-alpine
    container_name: smart-onboarding-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - smart-onboarding

  celery_worker:
    build:
      context: ./backend
    container_name: smart-onboarding-celery-worker
    restart: unless-stopped
    # Runs the AI Auto-Edit pipeline (studio/tasks.py) — same image as
    # `backend`, just a different process, so it shares that app's code,
    # dependencies, and mediafiles volume without a second Dockerfile. Keeps
    # the image's default entrypoint (docker-entrypoint.sh runs migrate +
    # collectstatic before exec'ing this), just overrides the final command.
    command: celery -A config worker --loglevel=info
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - media_files:/app/mediafiles
    networks:
      - smart-onboarding

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time only (baked into the client bundle) — `env_file` above
        # only affects runtime, so this still needs an explicit reference.
        # Compose resolves `${...}` from the root `.env` automatically.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: smart-onboarding-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - smart-onboarding

networks:
  smart-onboarding:
    driver: bridge

volumes:
  mysql_data:
  media_files:
